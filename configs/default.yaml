sd_version: "1.5" 
model_key: null 
input_path: "path/to/video"
work_dir: "workdir"

height: 512
width: 512

inversion:
  save_path: "${work_dir}/latents"
  prompt: "xxxx"
  n_frames: null 
  steps: 50 
  save_intermediate: False 
  save_steps: 50
  use_blip: False 
  recon: False 
  control: "none"
  control_scale: 1.0
  batch_size: 8
  force: False 


generation:
  control: "pnp" 

  pnp_attn_t: 0.5
  pnp_f_t: 0.8

  control_scale: 1.0
  
  guidance_scale: 7.5 
  n_timesteps: 50
  negative_prompt: "ugly, blurry, low res"
  prompt: null


  latents_path: "${work_dir}/latents"
  output_path: "${work_dir}"

  chunk_size: 4 
  chunk_ord: "mix-4"

  local_merge_ratio: 0.9
  merge_global: True
  global_merge_ratio: 0.8
  global_rand: 0.5
  align_batch: True
  enable_acac: false

  frame_range: [0, 32, 1] 
  frame_ids: null 
  save_frame: True


  use_lora: False


seed: 123
device: "cuda"
float_precision: "fp16" 
enable_xformers_memory_efficient_attention: True
